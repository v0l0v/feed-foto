<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast · Punto de vista</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; }

  .header-controls a.sources-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  #episodes {
    max-width: 1600px;
    margin: 0 auto;
    padding: var(--gap);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap: var(--gap);
  }

  .episode {
    background: linear-gradient(180deg, #141414, #0f0f0f);
    border: 1px solid rgba(255,1,0,0.22);
    border-left: 3px solid #ff0100;
    border-radius: 0;
    display: flex;
    flex-direction: column;
  }
  .episode.is-playing { border-color: #ff0100; box-shadow: 0 0 20px rgba(255,1,0,0.25); }

  .ep-art {
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #0a0a0a;
  }
  .ep-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .ep-body { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.9rem 1rem; background: #0a0a0a; flex: 1; }
  .ep-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ff0100;
  }
  .ep-date { color: rgba(240,236,228,0.4); }
  .ep-title {
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.25;
    margin: 0.2rem 0 0;
  }
  .ep-desc {
    color: rgba(240,236,228,0.6);
    font-size: 0.85rem;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0.3rem 0 0.5rem;
  }
  .ep-desc.expanded { display: block; }

  .ep-readmore {
    background: none;
    border: none;
    color: rgba(255,1,0,0.8);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    align-self: flex-start;
  }
  .ep-readmore:hover { color: #ff0100; }

  .episode .podcast-player { margin-top: auto; }

  .ep-empty { grid-column: 1 / -1; text-align: center; color: rgba(240,236,228,0.4); padding: 4rem 0; }

  #loader { max-width: 1600px; margin: 2rem auto; padding: 0 2rem; }

  @media (max-width: 720px) {
    #episodes { grid-template-columns: 1fr; gap: 2px; padding: 2px; }
    .ep-art { aspect-ratio: 4 / 3; }
    .ep-title { font-size: 1rem; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#episodes">Saltar al contenido</a>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html" style="text-decoration:none;color:inherit">
      <span class="logo-text">Punto de vista</span>
    </a>
    <div class="header-controls" role="toolbar" aria-label="Controles de filtro">
      <a id="podcast-filter-btn" class="sources-btn podcast-btn active" href="episodios.html" aria-label="Ir a los episodios del podcast">podcast</a>
      <a id="date-btn" class="sources-btn" href="index.html?panel=date" aria-label="Filtrar artículos por fecha">
        cuando <span id="date-btn-label">todo</span> ⌄
      </a>
      <a id="sources-btn" class="sources-btn" href="index.html?panel=sources" aria-label="Seleccionar fuentes de artículos">
        fuentes <span id="sources-btn-count" aria-live="polite">todas</span> ⌄
      </a>
    </div>
  </div>
</header>

<div id="podcast-hero" class="hide" aria-label="Podcast del día">
  <div class="podcast-hero-inner">
    <img id="podcast-hero-img" src="podcast-cover.png" alt="Punto de vista — podcast">
    <div class="podcast-hero-body">
      <span class="podcast-hero-badge"><span class="podcast-dot"></span> Podcast · Punto de vista</span>
      <h1 id="podcast-hero-title"></h1>
      <div class="podcast-hero-meta">
        <span id="hero-count"></span>
        <span id="podcast-hero-num"></span>
        <a href="podcast.xml">suscripción rss</a>
      </div>
    </div>
    <div class="podcast-player" id="podcast-hero-player" data-url="">
      <button class="podcast-play" aria-label="Reproducir">▶</button>
      <div class="podcast-progress"><div class="podcast-progress-fill"></div></div>
      <span class="podcast-time">0:00 / --:--</span>
      <input type="range" class="podcast-volume" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
    </div>
  </div>
</div>

<div id="loader"><span style="color:#ff0100">●</span> cargando episodios…</div>
<main id="episodes"></main>

<footer>
  <a href="index.html">punto de vista</a>
  <span>podcast diario</span>
</footer>

<script>
const RELEASE = 'https://github.com/v0l0v/puntodevista/releases/download/episodios';
const COVER = 'podcast-cover.png';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function fmtFecha(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return d + ' de ' + MESES[m - 1] + ' de ' + y;
}

function fmtDur(s) {
  if (!s) return '--:--';
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function splitItems(desc) {
  if (!desc) return [];
  return desc.split(/\n{2,}|(?=\*\*)/).map(s => s.trim()).filter(Boolean);
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDesc(desc) {
  const items = splitItems(desc);
  if (items.length <= 1) return esc(desc);
  return items.map(i => '<p style="margin:0 0 0.6rem">' + esc(i) + '</p>').join('');
}

const players = new Map();

function bindPlayer(root) {
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('.podcast-play');
    if (btn) {
      const player = btn.closest('.podcast-player');
      if (!player) return;
      const url = player.dataset.url;
      let p = players.get(url);
      if (!p) {
        const audio = new Audio(url);
        audio.preload = 'none';
        const fill = player.querySelector('.podcast-progress-fill');
        const time = player.querySelector('.podcast-time');
        const card = player.closest('.episode');
        audio.addEventListener('timeupdate', () => {
          if (!audio.duration) return;
          fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
          time.textContent = fmtDur(Math.floor(audio.currentTime)) + ' / ' + fmtDur(Math.floor(audio.duration));
        });
        audio.addEventListener('loadedmetadata', () => { time.textContent = '0:00 / ' + fmtDur(Math.floor(audio.duration)); });
        audio.addEventListener('ended', () => {
          btn.textContent = '▶';
          fill.style.width = '0%';
          time.textContent = '0:00 / ' + fmtDur(Math.floor(audio.duration));
          player.classList.remove('is-playing');
          if (card) card.classList.remove('is-playing');
        });
        p = { audio, btn, fill, time, player, card };
        players.set(url, p);
      }
      players.forEach((q) => {
        if (q !== p && !q.audio.paused) {
          q.audio.pause();
          q.btn.textContent = '▶';
          q.player.classList.remove('is-playing');
          if (q.card) q.card.classList.remove('is-playing');
        }
      });
      if (p.audio.paused) {
        p.audio.play().catch(() => {});
        btn.textContent = '⏸';
        player.classList.add('is-playing');
        if (p.card) p.card.classList.add('is-playing');
      } else {
        p.audio.pause();
        btn.textContent = '▶';
        player.classList.remove('is-playing');
        if (p.card) p.card.classList.remove('is-playing');
      }
      return;
    }

    const progress = e.target.closest('.podcast-progress');
    if (progress) {
      const player = progress.closest('.podcast-player');
      const p = player && players.get(player.dataset.url);
      if (p && p.audio.duration) {
        const r = progress.getBoundingClientRect();
        p.audio.currentTime = ((e.clientX - r.left) / r.width) * p.audio.duration;
      }
      return;
    }

    const rm = e.target.closest('.ep-readmore');
    if (rm) {
      const desc = rm.closest('.ep-body').querySelector('.ep-desc');
      const open = desc.classList.toggle('expanded');
      rm.textContent = open ? 'ocultar resumen' : 'ver resumen';
      rm.setAttribute('aria-expanded', String(open));
    }
  });

  root.addEventListener('input', (e) => {
    const vol = e.target.closest('.podcast-volume');
    if (!vol) return;
    const player = vol.closest('.podcast-player');
    const p = player && players.get(player.dataset.url);
    if (p && p.audio) p.audio.volume = parseFloat(vol.value);
  });
}

function renderEpisodes(meta) {
  const el = document.getElementById('episodes');
  if (!meta || !meta.length) {
    el.innerHTML = '<div class="ep-empty">todavía no hay episodios</div>';
    document.getElementById('loader').classList.add('hide');
    return;
  }

  const sorted = [...meta].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  document.getElementById('hero-count').textContent = sorted.length + (sorted.length === 1 ? ' episodio' : ' episodios');

  const latest = sorted[0];
  const heroImg = document.getElementById('podcast-hero-img');
  const heroTitle = document.getElementById('podcast-hero-title');
  const heroNum = document.getElementById('podcast-hero-num');
  const heroPlayer = document.getElementById('podcast-hero-player');
  if (heroImg) heroImg.src = latest.image || COVER;
  if (heroTitle) heroTitle.textContent = latest.podcast_title || 'Resumen diario';
  if (heroNum) heroNum.textContent = 'episodio ' + sorted.length + ' · ' + fmtFecha(latest.date) + ' · ' + fmtDur(latest.duration);
  if (heroPlayer) {
    heroPlayer.dataset.url = RELEASE + '/podcast-' + latest.date + '.mp3';
    const time = heroPlayer.querySelector('.podcast-time');
    if (time) time.textContent = '0:00 / ' + fmtDur(latest.duration);
  }
  document.getElementById('podcast-hero').classList.remove('hide');

  el.innerHTML = sorted.map((e, i) => {
    const num = sorted.length - i;
    const title = e.podcast_title || 'Resumen diario';
    const dur = fmtDur(e.duration);
    return `<article class="episode" data-id="${e.date}">
      <div class="ep-art">
        <img src="${e.image || COVER}" alt="" loading="lazy" onerror="this.src='${COVER}'">
      </div>
      <div class="ep-body">
        <span class="ep-badge"><span class="podcast-dot"></span> Episodio ${num} · <span class="ep-date">${fmtFecha(e.date)}</span></span>
        <h2 class="ep-title">${esc(title)}</h2>
        <div class="ep-desc">${fmtDesc(e.description)}</div>
        <button class="ep-readmore" type="button" aria-expanded="false">ver resumen</button>
        <div class="podcast-player" data-url="${RELEASE}/podcast-${e.date}.mp3">
          <button class="podcast-play" aria-label="Reproducir">▶</button>
          <div class="podcast-progress"><div class="podcast-progress-fill"></div></div>
          <span class="podcast-time">0:00 / ${dur}</span>
          <input type="range" class="podcast-volume" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
        </div>
      </div>
    </article>`;
  }).join('');

  document.getElementById('loader').classList.add('hide');
}

(async () => {
  bindPlayer(document.body);
  try {
    const resp = await fetch('podcast_meta.json', { cache: 'no-store' });
    const meta = await resp.json();
    renderEpisodes(Array.isArray(meta) ? meta : []);
  } catch {
    document.getElementById('loader').innerHTML = '<span style="color:#ff0100">●</span> no se pudo cargar el podcast';
  }
})();
</script>
</body>
</html>
