name: Refrescar Lomography

on:
  schedule:
    - cron: '0 10,18 * * *'
  workflow_dispatch:

concurrency:
  group: feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-lomo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar firecrawl CLI
        run: npm install -g firecrawl-cli

      - name: Configurar git
        run: |
          git config user.name "feed-foto bot"
          git config user.email "actions@github.com"

      - name: Comprobar créditos Firecrawl
        id: credits
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python3 check_firecrawl_credits.py 50

      - name: Refrescar Lomography (1 scrape)
        if: steps.credits.outcome == 'success'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python3 update_lists.py --fresh-lomography
