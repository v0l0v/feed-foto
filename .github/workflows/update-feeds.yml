name: Actualizar feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar firecrawl CLI
        run: npm install -g firecrawl-cli

      - name: Actualizar listas de feeds
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python3 update_lists.py
