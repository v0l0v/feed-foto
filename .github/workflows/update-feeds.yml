name: Actualizar feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar git
        run: |
          git config user.name "pdv bot"
          git config user.email "actions@github.com"

      - name: Actualizar listas de feeds (sin Firecrawl, 0 créditos)
        run: python3 update_lists.py
